task generateReleaseKeystore {
    doLast {
        // Resolved inside doLast, so a debug-only clone never needs these values.
        def storePass = System.getenv("CHATZ_KEYSTORE_PASSWORD")
        if (!storePass) {
            def pf = file("keystore.properties")
            if (pf.exists()) {
                def kp = new Properties()
                pf.withInputStream { kp.load(it) }
                storePass = kp.getProperty("storePassword")
            }
        }
        if (!storePass) {
            throw new GradleException("generateReleaseKeystore: set CHATZ_KEYSTORE_PASSWORD or create app/keystore.properties")
        }
        def keystoreFile = file("chatz-release-key.keystore")
        if (keystoreFile.exists()) {
            println "Keystore already exists at ${keystoreFile.absolutePath}"
            return
        }

        println "Generating release keystore..."

        // Use keytool via exec since it's part of JDK
        def javaHome = System.getenv('JAVA_HOME')
        def keytoolPath = javaHome ? "${javaHome}/bin/keytool" : "keytool"

        try {
            exec {
                commandLine(
                    keytoolPath,
                    '-genkey',
                    '-v',
                    '-keystore', keystoreFile.absolutePath,
                    '-alias', 'chatz',
                    '-keyalg', 'RSA',
                    '-keysize', '2048',
                    '-validity', '10000',
                    '-storepass', storePass,
                    '-keypass', storePass,
                    '-dname', 'CN=ChatZ, OU=ChatZ, O=ChatZ, L=City, S=State, C=US'
                )
            }
            println "Keystore generated successfully at ${keystoreFile.absolutePath}"
        } catch (Exception e) {
            println "Warning: Could not generate keystore automatically."
            println "Cannot generate the keystore automatically from here. Create app/keystore.properties or export CHATZ_KEYSTORE_PASSWORD, then re-run: ./gradlew generateReleaseKeystore"
            throw e
        }
    }
}

preBuild.dependsOn generateReleaseKeystore
